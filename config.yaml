db_path: ./bloom.db
calendar_url: https://nfs.faireconomy.media/ff_calendar_thisweek.json
max_news: 15

cadences:          # seconds between fetcher runs
  equity: 300
  bonds: 3600
  macro: 3600      # job runs hourly; refresh decision logic inside (spec: 6h, hourly on release days)
  news: 600
  defi: 900
  midnight: 900
  refs: 900
  refs_history: 86400
  morpho: 900
  cycle: 86400   # daily; weekly sources just re-upsert (idempotent)
  actuals: 600   # every 10 min; only calls a source when a released row still lacks its actual
  fx: 300
  sectors: 900

indexes:           # all served by yahoo
  - { symbol: SPX,  name: "S&P 500",       yahoo: "^GSPC" }
  - { symbol: NDX,  name: "Nasdaq 100",    yahoo: "^NDX" }   # validate-in-smoke
  - { symbol: DJI,  name: "Dow Jones",     yahoo: "^DJI" }
  - { symbol: SX5E, name: "Euro Stoxx 50", yahoo: "^STOXX50E" }   # validate-in-smoke
  - { symbol: DAX,  name: "DAX",           yahoo: "^GDAXI" }
  - { symbol: CAC,  name: "CAC 40",        yahoo: "^FCHI" }
  - { symbol: UKX,  name: "FTSE 100",      yahoo: "^FTSE" }   # validate-in-smoke
  - { symbol: SMI,  name: "SMI",           yahoo: "^SSMI" }   # validate-in-smoke
  - { symbol: NKX,  name: "Nikkei 225",    yahoo: "^N225" }
  - { symbol: HSI,  name: "Hang Seng",     yahoo: "^HSI" }   # validate-in-smoke

fx:                # MKT tab CURRENCIES panel; served by yahoo
  - { symbol: DXY,    name: "US Dollar Index", yahoo: "DX-Y.NYB" }
  - { symbol: EURUSD, name: "EUR/USD", yahoo: "EURUSD=X" }
  - { symbol: GBPUSD, name: "GBP/USD", yahoo: "GBPUSD=X" }
  - { symbol: USDJPY, name: "USD/JPY", yahoo: "USDJPY=X" }
  - { symbol: USDCHF, name: "USD/CHF", yahoo: "USDCHF=X" }
  - { symbol: AUDUSD, name: "AUD/USD", yahoo: "AUDUSD=X" }
  - { symbol: USDCAD, name: "USD/CAD", yahoo: "USDCAD=X" }
  - { symbol: USDCNH, name: "USD/CNH", yahoo: "USDCNH=X" }
  - { symbol: EURGBP, name: "EUR/GBP", yahoo: "EURGBP=X" }
  - { symbol: EURCHF, name: "EUR/CHF", yahoo: "EURCHF=X" }
  - { symbol: EURJPY, name: "EUR/JPY", yahoo: "EURJPY=X" }

sectors:           # SECTORS tab, one panel per group; served by yahoo
