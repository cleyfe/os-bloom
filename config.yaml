bonds:
  - { country: US, tenor: 10Y, fred: DGS10 }
  - { country: US, tenor: 3M,  fred: DGS3MO }
  - { country: DE, tenor: 10Y, bundesbank: "D.I.ZST.ZI.EUR.S1311.B.A604.R10XX.R.A.A._Z._Z.A" }
  - { country: DE, tenor: 3M,  ecb: "YC.B.U2.EUR.4F.G_N_A.SV_C_YM.SR_3M" }  # euro-area AAA curve; ≈ Bunds at the short end
  # No UK row: the only keyless daily gilt source is the BoE IADB CSV export,
  # whose path robots.txt disallows.

cb_rates:          # policy rates for the WORLD BONDS matrix; country must match a bonds row
  - { country: US, label: FED, fred: DFEDTARU }
  - { country: DE, label: ECB, fred: ECBDFR }

series:            # macro click-through charts; transform per changes.apply_transform
  - { id: us-cpi-yoy,       name: "US CPI YoY %",            fred: CPIAUCSL,           unit: "%",   transform: yoy }
  - { id: us-core-cpi-yoy,  name: "US Core CPI YoY %",       fred: CPILFESL,           unit: "%",   transform: yoy }
  - { id: us-pce-yoy,       name: "US PCE YoY %",            fred: PCEPI,              unit: "%",   transform: yoy }
  - { id: us-nfp,           name: "US Non-Farm Payrolls Δk", fred: PAYEMS,             unit: "k",   transform: diff }
  - { id: us-unemployment,  name: "US Unemployment %",       fred: UNRATE,             unit: "%",   transform: none }
  - { id: us-gdp,           name: "US Real GDP QoQ SAAR %",  fred: A191RL1Q225SBEA,    unit: "%",   transform: none }
  - { id: us-retail,        name: "US Retail Sales MoM %",   fred: RSAFS,              unit: "%",   transform: pct_prev }
  - { id: us-fed-rate,      name: "Fed Funds Target Upper %",fred: DFEDTARU,           unit: "%",   transform: none }
  - { id: ez-hicp-yoy,      name: "EZ HICP YoY %",           fred: CP0000EZ19M086NEST, unit: "%",   transform: yoy }
  - { id: ez-unemployment,  name: "EZ Unemployment %",       fred: LRHUTTTTEZM156S,    unit: "%",   transform: none }
  - { id: ez-gdp,           name: "EZ Real GDP QoQ %",       fred: CLVMEURSCAB1GQEA19, unit: "%",   transform: pct_prev }
  - { id: ez-ecb-rate,      name: "ECB Deposit Rate %",      fred: ECBDFR,             unit: "%",   transform: none }

cycle_series:      # market-cycle series (spec 2026-08-24); exactly one source key each
  # ---- hidden infrastructure ----
  - { id: usrec,        name: "NBER Recession",            unit: idx,   fred: USREC, hidden: true }
  # ---- RISK ----
  - { id: vix,          name: "VIX",                       unit: idx,   fred: VIXCLS }
  - { id: vxn,          name: "VXN (Nasdaq vol)",          unit: idx,   fred: VXNCLS }
  - { id: pc-total,     name: "Put/Call total",            unit: ratio, cboe: "TOTAL PUT/CALL RATIO" }
  - { id: pc-equity,    name: "Put/Call equity",           unit: ratio, cboe: "EQUITY PUT/CALL RATIO" }
  - { id: aaii-spread,  name: "AAII bull-bear spread",     unit: pts,   aaii: bull_bear_spread }
  - { id: cyc-def,      name: "Cyclicals vs defensives",   unit: ratio, yahoo_ratio: [XLY, XLP] }
  - { id: dax-smi,      name: "DAX vs SMI",                unit: ratio, yahoo_ratio: ["^GDAXI", "^SSMI"] }
  - { id: small-large,  name: "Small vs large (IWM/SPY)",  unit: ratio, yahoo_ratio: [IWM, SPY] }
  - { id: gold-silver,  name: "Gold vs silver",            unit: ratio, yahoo_ratio: ["GC=F", "SI=F"] }
  - { id: spw-spx,      name: "Equal-weight vs SPX",       unit: ratio, yahoo_ratio: [RSP, SPY] }
  # ---- ECON ----
  # DBnomics' ISM mirror grew corrupt tail values (~10) in late 2025; diffusion
  # indices live in ~[25, 75], so clamp to drop garbage without hiding real prints
  - { id: ism-pmi,      name: "ISM Manufacturing PMI",     unit: idx,   dbnomics: "ISM/pmi/pm",    valid_range: [20, 80] }
  - { id: ism-svc,      name: "ISM Services PMI",          unit: idx,   dbnomics: "ISM/nm-pmi/pm", valid_range: [20, 80] }
  - { id: oecd-cli-us,  name: "OECD CLI US",               unit: idx,   oecd: "OECD.SDD.STES,DSD_STES@DF_CLI,4.1/USA.M.LI...AA...H" }
  - { id: oecd-cli-ea,  name: "OECD CLI Europe (G4E)",     unit: idx,   oecd: "OECD.SDD.STES,DSD_STES@DF_CLI,4.1/G4E.M.LI...AA...H" }  # no euro-area aggregate in DF_CLI; G4E = DE/FR/IT/GB
  - { id: claims,       name: "Initial jobless claims",    unit: k,     fred: ICSA }
  - { id: jolts,        name: "Job openings (JOLTS)",      unit: k,     fred: JTSJOL }
  - { id: trucks,       name: "Heavy truck sales",         unit: m,     fred: HTRUCKSSAAR }  # FRED serves millions of units SAAR
  - { id: umich,        name: "UMich consumer sentiment",  unit: idx,   fred: UMCSENT }
  - { id: m2-yoy,       name: "M2 YoY",                    unit: "%",   fred: M2SL, transform: yoy }
  - { id: m2-velocity,  name: "M2 velocity",               unit: ratio, fred: M2V }
  - { id: breakeven-10y,name: "10Y breakeven",             unit: "%",   fred: T10YIE }
  - { id: infl-5y5y,    name: "5y5y fwd inflation",        unit: "%",   fred: T5YIFR }
  - { id: real-10y,     name: "10Y real rate (TIPS)",      unit: "%",   fred: DFII10 }
  - { id: usd-broad,    name: "USD broad index",           unit: idx,   fred: DTWEXBGS }
  # ---- CREDIT ----
  - { id: t10y3m,       name: "US 10Y-3M curve",           unit: "%",   fred: T10Y3M }
  - { id: t10y2y,       name: "US 10Y-2Y curve",           unit: "%",   fred: T10Y2Y }
  - { id: ig-oas,       name: "US IG OAS",                 unit: "%",   fred: BAMLC0A0CM }
  - { id: hy-oas,       name: "US HY OAS",                 unit: "%",   fred: BAMLH0A0HYM2 }
  - { id: eu-hy-oas,    name: "Euro HY OAS",               unit: "%",   fred: BAMLHE00EHYIOAS }
  - { id: bbb-oas,      name: "US BBB OAS",                unit: "%",   fred: BAMLC0A4CBBB }
  - { id: ccc-oas,      name: "US CCC OAS",                unit: "%",   fred: BAMLH0A3HYC }
  - { id: nfci,         name: "Chicago Fed NFCI",          unit: idx,   fred: NFCI }
  - { id: bank-lending, name: "Bank loans & leases YoY",   unit: "%",   fred: LOANS, transform: yoy }  # monthly; weekly TOTLL never aligns for the yoy transform
  # ---- PROFIT ---- (S&P EPS workbook is Akamai-403'd; FRED CP carries the cycle)
  - { id: corp-profits, name: "Corporate profits YoY",     unit: "%",   fred: CP, transform: yoy }
  # ---- POS ----
  - { id: cot-vix,      name: "VIX net non-commercial",    unit: contracts, cftc: "1170E1" }
  - { id: cot-crude,    name: "Crude net non-commercial",  unit: contracts, cftc: "067651" }
  - { id: cot-usd,      name: "USD idx net non-commercial",unit: contracts, cftc: "098662" }
  - { id: cot-gbp,      name: "GBP net non-commercial",    unit: contracts, cftc: "096742" }

cycle_tabs:        # layout only; rows reference cycle_series ids
  - id: risk
    label: RISK
    panels:
      - title: "VOLATILITY & HEDGING"
        rows:
          - { series: vix,         overlay: t10y2y }
          - { series: vxn }
          - { series: pc-total }
          - { series: pc-equity }
      - title: "SENTIMENT & ROTATION"
        rows:
          - { series: aaii-spread }
          - { series: cyc-def }
          - { series: dax-smi }
          - { series: small-large }
          - { series: gold-silver }
          - { series: spw-spx }
  - id: econ
    label: ECON
    panels:
      - title: "SURVEYS & LEADING"
        rows:
          - { series: ism-pmi,     overlay: t10y2y }
          - { series: ism-svc }
          - { series: oecd-cli-us }
          - { series: oecd-cli-ea }
          - { series: umich }
      - title: "ACTIVITY & MONEY"
        rows:
          - { series: claims }
          - { series: jolts }
          - { series: trucks }
          - { series: m2-yoy }
          - { series: m2-velocity }
          - { series: usd-broad }
      - title: "INFLATION & RATES"
        rows:
          - { series: breakeven-10y }
          - { series: infl-5y5y }
          - { series: real-10y }
  - id: credit
    label: CREDIT
    panels:
      - title: "CURVE"
        rows:
          - { series: t10y3m,      overlay: vix }
          - { series: t10y2y }
      - title: "SPREADS & CONDITIONS"
        rows:
          - { series: ig-oas }
          - { series: hy-oas,      overlay: ism-pmi }
          - { series: eu-hy-oas }
          - { series: bbb-oas }
          - { series: ccc-oas }
          - { series: nfci }
          - { series: bank-lending }
  - id: profit
    label: PROFIT
    panels:
      - title: "PROFIT CYCLE"
        rows:
          - { series: corp-profits, overlay: ism-pmi }
  - id: pos
    label: POS
    panels:
      - title: "CFTC NET NON-COMMERCIAL"
        rows:
          - { series: cot-vix,     overlay: vix }
          - { series: cot-crude }
          - { series: cot-usd,     overlay: usd-broad }
          - { series: cot-gbp }

calendar_map:      # first match wins — keep Core before CPI
  - { country: USD, match: "Core CPI",     series: us-core-cpi-yoy }
  - { country: USD, match: "CPI",          series: us-cpi-yoy }
  - { country: USD, match: "Core PCE",     series: us-pce-yoy }
  - { country: USD, match: "Non-Farm",     series: us-nfp }
  - { country: USD, match: "Unemployment", series: us-unemployment }
  - { country: USD, match: "GDP",          series: us-gdp }
  - { country: USD, match: "Retail Sales", series: us-retail }
  - { country: USD, match: "Federal Funds Rate", series: us-fed-rate }
  - { country: EUR, match: "Core CPI",     series: ez-hicp-yoy }
  - { country: EUR, match: "CPI",          series: ez-hicp-yoy }
  - { country: EUR, match: "Unemployment", series: ez-unemployment }
  - { country: EUR, match: "GDP",          series: ez-gdp }
  - { country: EUR, match: "Main Refinancing Rate", series: ez-ecb-rate }

actuals:           # the printed number for a released calendar row, from a free series; first match wins
  # USD from FRED. m/m and y/y share a series; the rule decides the arithmetic.
  # Reference period: the newest observation between `lag` periods before the release period and the
  # release period itself (the euro-area flash can land inside its own month), or for d the first
  # observation `lag` days after a decision. `exclude` keeps look-alike titles (ADP, national prints) out.
  - { country: USD, match: "Core CPI m/m",              fred: CPILFESL,        calc: pct_prev }
  - { country: USD, match: "Core CPI y/y",              fred: CPILFENS,        calc: pct_yoy }   # y/y is printed NSA
  - { country: USD, match: "CPI m/m",                   fred: CPIAUCSL,        calc: pct_prev }
  - { country: USD, match: "CPI y/y",                   fred: CPIAUCNS,        calc: pct_yoy }   # y/y is printed NSA
  - { country: USD, match: "Core PPI m/m",              fred: PPIFES,          calc: pct_prev }
  - { country: USD, match: "PPI m/m",                   fred: PPIFIS,          calc: pct_prev }
  - { country: USD, match: "Core PCE Price Index m/m",  fred: PCEPILFE,        calc: pct_prev }
  - { country: USD, match: "Non-Farm Employment Change", fred: PAYEMS,         calc: diff_k, fmt: k, exclude: [ADP] }
  - { country: USD, match: "Unemployment Rate",         fred: UNRATE }
  - { country: USD, match: "GDP q/q",                   fred: A191RL1Q225SBEA, freq: q }   # Advance / Prelim / Final
  - { country: USD, match: "Core Retail Sales m/m",     fred: RSFSXMV,         calc: pct_prev }
  - { country: USD, match: "Retail Sales m/m",          fred: RSAFS,           calc: pct_prev }
  - { country: USD, match: "Federal Funds Rate",        fred: DFEDTARU,        freq: d, lag: 1, fmt: pct2 }  # effective the day after
  # EUR from Eurostat (keyless JSON-stat; datasets re-based in 2026, euro area is EA21) and FRED for the ECB rate.
  - { country: EUR, match: "Core CPI Flash Estimate y/y", eurostat: "prc_hicp_minr?geo=EA21&unit=RCH_A&coicop18=TOT_X_NRG_FOOD" }
  - { country: EUR, match: "CPI Flash Estimate y/y",      eurostat: "prc_hicp_minr?geo=EA21&unit=RCH_A&coicop18=TOTAL" }
  - { country: EUR, match: "Unemployment Rate",           eurostat: "une_rt_m?geo=EA21&s_adj=SA&age=TOTAL&sex=T&unit=PC_ACT", lag: 2,
      exclude: [German, French, Italian, Spanish] }
  - { country: EUR, match: "GDP q/q",                     eurostat: "namq_10_gdp?geo=EA21&unit=CLV_PCH_PRE&s_adj=SCA&na_item=B1GQ", freq: q,
      exclude: [German, French, Italian, Spanish] }
  - { country: EUR, match: "Main Refinancing Rate",       fred: ECBMRRFR, freq: d, lag: 6, fmt: pct2 }  # effective the following week

feeds:             # RSS bundle; a dead feed is skipped silently
  - { name: FT,          url: "https://www.ft.com/rss/home" }
  - { name: CNBC,        url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114" }
  - { name: MarketWatch, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories" }
  - { name: ECB,         url: "https://www.ecb.europa.eu/rss/press.html" }
  - { name: Fed,         url: "https://www.federalreserve.gov/feeds/press_all.xml" }

