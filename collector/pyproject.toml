[project]
name = "collector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # <0.140: main.py wires scheduler start/stop via router.on_startup/on_shutdown
    # (deprecated Starlette hooks; add_event_handler was already removed once).
    # Re-verify that mechanism before raising this ceiling.
    "fastapi>=0.110,<0.140",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pyyaml>=6",
    "feedparser>=6.0.11",
    "xlrd>=2",  # AAII sentiment survey ships as legacy .xls
    "openpyxl>=3.1",  # BoE yield-curve workbooks ship as .xlsx
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
